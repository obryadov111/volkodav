# Пак «Astra Linux»: ТОЛЬКО ОБНАРУЖЕНИЕ платформы (maturity: inventory).
#
# Проверок нет намеренно. Astra Linux — сертифицированная ОС на основе Debian со своими механизмами защиты
# (режимы защиты, мандатный контроль целостности, мандатное управление доступом, замкнутая программная
# среда). Команды и параметры их проверки нельзя писать по памяти: они снимаются на реальном образе конкретной
# версии и редакции, по руководству вендора. Пока образа нет, платформа честно остаётся «видимой, но не
# оцениваемой»: агент распознаёт её, собирает список ПО, а оценка не выставляется (score = пусто, а не 100 %).
#
# Детект — по вхождению «astra» в ID / NAME / PRETTY_NAME файла /etc/os-release, а не по точному значению ID:
# точное значение для разных версий и редакций не сверено с образом.

pack: astra-linux
version: 1.0.0
maturity: inventory
tags: [linux-server, debian-family, astra]
transport: local
asset_type: linux-server

detect:
  - probe: { type: file_regex, path: /etc/os-release, pattern: '(?im)^(?:ID|NAME|PRETTY_NAME)="?([^"\n]*astra[^"\n]*)' }
    regex: '(?i)astra'

checks: []
